<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVE FM ONLINE - Siempre Contigo</title>
    <!-- Fuentes llamativas y modernas -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)), 
                        url('img/control.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 30px 20px 10px;
            width: 100%;
        }

        /* Contenedor del Logo con filtros para remover fondos azul y blanco */
        .logo-container {
            max-width: 320px;
            margin: 0 auto;
        }

        .logo-container img {
            width: 100%;
            height: auto;
            object-fit: contain;
            /* Filtros avanzados combinados para aislar y limpiar las letras neón */
            filter: contrast(160%) brightness(120%) drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
            mix-blend-mode: screen; 
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 25px;
        }

        .player-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .volume-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            cursor: pointer;
            z-index: 2;
        }

        .volume-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.1);
            stroke-width: 12;
        }

        .volume-progress {
            fill: none;
            stroke: #00f0ff;
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.05s linear, filter 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.8));
        }

        .play-btn {
            position: absolute;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff007f, #ff5500);
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            z-index: 3;
            font-size: 4.8rem;
            color: #fff;
            line-height: 1;
        }

        .play-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 45px rgba(255, 0, 127, 0.8);
        }

        .play-btn span {
            display: inline-block;
            transform: translateX(8px);
            transition: transform 0.2s ease;
        }

        .play-btn.playing span {
            transform: translateX(0);
        }

        .live-badge {
            position: absolute;
            top: -30px;
            background: #ff0000;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 15px #ff0000;
            z-index: 4;
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 12px 25px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        .counter-icon {
            width: 10px;
            height: 10px;
            background: #00f0ff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #00f0ff;
            animation: pulse 1s infinite;
        }

        .counter-text {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #e0e0e0;
        }

        .counter-text span {
            color: #00f0ff;
            font-size: 1.2rem;
            font-weight: 900;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 30px 20px;
            background: rgba(0, 0, 0, 0.7);
            border-top: 3px solid #ff007f;
            backdrop-filter: blur(5px);
        }

        footer p {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 480px) {
            .logo-container { max-width: 240px; }
            .player-wrapper { width: 250px; height: 250px; }
            .play-btn { width: 150px; height: 150px; font-size: 3.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <!-- Tu logo original cargado localmente con remoción automática de fondo azul/blanco -->
        <div class="logo-container">
            <img src="img/logo.png" alt="VIVE FM ONLINE">
        </div>
    </header>

    <div class="main-container">
        <div class="player-wrapper" id="playerWrapper">
            <div class="live-badge">EN VIVO</div>
            
            <svg class="volume-svg" id="volumeSvg" viewBox="0 0 200 200">
                <circle class="volume-bg" cx="100" cy="100" r="85"></circle>
                <circle class="volume-progress" id="volumeProgress" cx="100" cy="100" r="85"></circle>
            </svg>
            
            <button class="play-btn" id="playBtn" onclick="togglePlay()">
                <span id="playIcon">▶</span>
            </button>
        </div>

        <div class="counter-box">
            <span class="counter-icon"></span>
            <div class="counter-text">Oyentes en línea: <span id="listenerCount">193</span></div>
        </div>
    </div>

    <!-- Enlace directo de reproducción optimizado para tu señal Icecast en Zeno.fm -->
    <audio id="radioStream" src="https://stream.zeno.fm/ctv5k5brgpfvv" preload="auto" crossorigin="anonymous"></audio>
        <script>
        // ID de tu estación ZenoMedia extraída de tu Mount Point para el contador real
        const ZENO_STATION_ID = "dcn6brncfg8u"; 

        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const volumeProgress = document.getElementById('volumeProgress');
        const volumeSvg = document.getElementById('volumeSvg');
        const listenerCountEl = document.getElementById('listenerCount');

        let isPlaying = false;
        let isDragging = false;
        let currentVolume = 0.8;

        const radius = 85;
        const circumference = 2 * Math.PI * radius;
        volumeProgress.style.strokeDasharray = circumference;

        function updateVolume(volumeFactor) {
            currentVolume = Math.max(0, Math.min(1, volumeFactor));
            audio.volume = currentVolume;
            const offset = circumference - (currentVolume * circumference);
            volumeProgress.style.strokeDashoffset = offset;
            volumeProgress.style.filter = `drop-shadow(0 0 ${currentVolume * 15}px rgba(0, 240, 255, 0.9))`;
        }

        function handleVolumeDrag(e) {
            const rect = volumeSvg.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches.clientX : e.clientX;
            const clientY = e.touches ? e.touches.clientY : e.clientY;
            const dx = clientX - centerX;
            const dy = clientY - centerY;
            let angle = Math.atan2(dy, dx) + Math.PI / 2;
            if (angle < 0) angle += 2 * Math.PI;
            const volumeFactor = angle / (2 * Math.PI);
            updateVolume(volumeFactor);
        }

        volumeSvg.addEventListener('mousedown', (e) => { isDragging = true; handleVolumeDrag(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) handleVolumeDrag(e); });
        window.addEventListener('mouseup', () => isDragging = false);
        volumeSvg.addEventListener('touchstart', (e) => { isDragging = true; handleVolumeDrag(e); }, {passive: true});
        window.addEventListener('touchmove', (e) => { if (isDragging) handleVolumeDrag(e); }, {passive: true});
        window.addEventListener('touchend', () => isDragging = false);

        updateVolume(currentVolume);

        function setPlayingState() {
            playIcon.textContent = '❚❚';
            playIcon.style.transform = 'translateX(0)';
            playBtn.classList.add('playing');
            isPlaying = true;
        }

        function setPausedState() {
            playIcon.textContent = '▶';
            playIcon.style.transform = 'translateX(8px)';
            playBtn.classList.remove('playing');
            isPlaying = false;
        }

        function togglePlay() {
            if (!isPlaying) {
                audio.play().then(setPlayingState).catch(err => console.log("Error:", err));
            } else {
                audio.pause();
                setPausedState();
            }
        }

        // LECTURA DE OYENTES EN TIEMPO REAL DESDE LA API OFICIAL DE ZENO.FM
        async function fetchZenoStats() {
            try {
                const response = await fetch(`https://zeno.fm{ZENO_STATION_ID}/current-listeners`);
                if (response.ok) {
                    const data = await response.json();
                    // Asigna el número exacto de oyentes activos reportados por el servidor
                    listenerCountEl.textContent = data.listeners !== undefined ? data.listeners : 0;
                }
            } catch (error) {
                console.log("Sincronizando con los servidores de Zeno...");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            audio.play().then(setPlayingState).catch(() => setPausedState());
            // Consulta inicial y actualización automática cada 10 segundos
            fetchZenoStats();
            setInterval(fetchZenoStats, 10000); 
        });
    </script>
</body>
</html>
